<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animated Todo List</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <a href="#" class="nav-brand">TaskFlow</a>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Tasks</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-wrapper">
        <div class="todo-container">
            <h1>My Todo List</h1>
            <ul>
                <li>
                    <input type="checkbox" id="todo-1">
                    <label for="todo-1">Learn CSS Grid and Flexbox</label>
                </li>
                <li>
                    <input type="checkbox" id="todo-2" checked>
                    <label for="todo-2">Setup GitHub Repository</label>
                </li>
                <li>
                    <input type="checkbox" id="todo-3">
                    <label for="todo-3">Build a JavaScript Todo App</label>
                </li>
                <li>
                    <input type="checkbox" id="todo-4">
                    <label for="todo-4">Deploy project to GitHub Pages</label>
                </li>
            </ul>
        </div>
    </div>

</body>
</html>
